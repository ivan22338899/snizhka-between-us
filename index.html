<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNIZHKA — BETWEEN US</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #2a1719 0%, #0d0b0b 45%, #050505 100%);
      color: #eee5dc;
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
    }

    .player {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .label {
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 5px;
      color: #b86470;
      margin-bottom: 18px;
    }

    .cover {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      box-shadow: 0 25px 70px rgba(0,0,0,.65);
      border: 1px solid rgba(184,100,112,.25);
    }

    h1 {
      margin: 28px 0 3px;
      font-size: 34px;
      font-weight: normal;
      letter-spacing: 6px;
    }

    h2 {
      margin: 0;
      color: #b86470;
      font-family: Arial, sans-serif;
      font-size: 13px;
      font-weight: normal;
      letter-spacing: 7px;
    }

    .headphones {
      margin: 18px 0 24px;
      font-style: italic;
      font-size: 13px;
      color: #8f8580;
    }

    audio {
      width: 100%;
      height: 42px;
      filter: sepia(20%);
    }

    .footer {
      margin-top: 27px;
      font-family: Arial, sans-serif;
      font-size: 9px;
      letter-spacing: 4px;
      color: #675c59;
    }
  </style>
</head>

<body>

  <main class="player">

    <div class="label">PRIVATE SESSION • 2026</div>

    <img
      class="cover"
      src="7777777777.png"
      alt="SNIZHKA — BETWEEN US"
    >

    <h1>SNIZHKA</h1>
    <h2>BETWEEN US</h2>

    <div class="headphones">
      This page sounds better with headphones.
    </div>

    <audio controls preload="metadata">
      <source src="7777777.mp3" type="audio/mpeg">
    </audio>

    <div class="footer">
      ONE VOICE • ONE RECORDING • ONE MOMENT
    </div>

  </main>

</body>
</html>
