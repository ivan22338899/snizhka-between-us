<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNIZHKA — BETWEEN US</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(
        circle at top,
        #2a1719 0%,
        #0d0b0b 45%,
        #050505 100%
      );
      color: #eee5dc;
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
    }

    .player {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .label {
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 5px;
      color: #b86470;
      margin-bottom: 18px;
    }

    .cover {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      box-shadow: 0 25px 70px rgba(0,0,0,.65);
      border: 1px solid rgba(184,100,112,.25);
    }

    /* КНОПКА КВЕСТУ */

    .quest-button {
      margin: 35px 0;
    }

    .start-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 18px 22px;
      background: #2d65d5;
      color: white;
      border: none;
      border-radius: 30px;
      font-family: Arial, sans-serif;
      letter-spacing: 2px;
      font-size: 17px;
      font-weight: bold;
      box-shadow: 0 10px 30px rgba(45,101,213,.4);
      cursor: pointer;
      transition: 0.3s ease;
    }

    .start-btn:hover {
      background: #4386ee;
      transform: scale(1.04);
      box-shadow: 0 15px 40px rgba(45,101,213,.6);
    }

    .snowflake {
      display: inline-block;
      font-size: 38px;
      line-height: 1;
      color: white;
      text-shadow: 0 0 15px white;
      animation: snowGlow 3s ease-in-out infinite;
    }

    @keyframes snowGlow {
      0%, 100% {
        text-shadow: 0 0 8px rgba(255,255,255,.5);
      }
      50% {
        text-shadow: 0 0 22px white;
      }
    }

    /* ПОЛЕ ПАРОЛЯ */

    .password-box {
      display: none;
      margin: 20px 0 35px;
      padding: 25px;
      background: rgba(45,101,213,.08);
      border: 1px solid rgba(100,160,255,.35);
      border-radius: 20px;
      animation: fadeIn .5s ease;
    }

    .password-box h3 {
      font-size: 21px;
      font-weight: normal;
      margin: 0 0 12px;
      color: #a8d5ff;
    }

    .password-box p {
      font-size: 14px;
      color: #b8aaa8;
      line-height: 1.7;
    }

    .password-box input {
      width: 100%;
      padding: 15px;
      margin: 12px 0;
      background: #151820;
      border: 1px solid #4b78a8;
      border-radius: 12px;
      color: white;
      font-size: 18px;
      text-align: center;
      outline: none;
    }

    .password-box input:focus {
      border-color: #8ec8ff;
    }

    .check-btn {
      width: 100%;
      padding: 15px;
      background: #2d65d5;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: .3s;
    }

    .check-btn:hover {
      background: #4386ee;
    }

    #message {
      margin-top: 15px;
      font-size: 14px;
      color: #a8d5ff;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      margin: 28px 0 3px;
      font-size: 34px;
      font-weight: normal;
      letter-spacing: 6px;
    }

    h2 {
      margin: 0;
      color: #b86470;
      font-family: Arial, sans-serif;
      font-size: 13px;
      font-weight: normal;
      letter-spacing: 7px;
    }

    .headphones {
      margin: 18px 0 24px;
      font-style: italic;
      font-size: 13px;
      color: #8f8580;
    }

    audio {
      width: 100%;
      height: 42px;
      filter: sepia(20%);
    }

    .footer {
      margin-top: 27px;
      font-family: Arial, sans-serif;
      font-size: 9px;
      letter-spacing: 4px;
      color: #675c59;
    }

    @media (max-width: 400px) {
      .start-btn {
        font-size: 14px;
        letter-spacing: 1px;
        gap: 8px;
      }

      .snowflake {
        font-size: 34px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .snowflake {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <main class="player">

    <div class="label">PRIVATE SESSION • 2026</div>

    <img
      class="cover"
      src="7777777777.png"
      alt="SNIZHKA — BETWEEN US"
    >

    <!-- КНОПКА ПОЧАТКУ -->

    <div class="quest-button">
      <button class="start-btn" onclick="showPassword()">
        <span class="snowflake">❄</span>
        <span>Ти мене знайшла)) Готова почати?</span>
      </button>
    </div>

    <!-- ПЕРШИЙ ПАРОЛЬ -->

    <div class="password-box" id="passwordBox">

      <h3>❄️ Перший ключ</h3>

      <p>
        Щоб продовжити, введи пароль,
        який ти отримала разом із квітами.
      </p>

      <input
        type="text"
        id="password"
        placeholder="Введи пароль..."
        autocomplete="off"
      >

      <button class="check-btn" onclick="checkPassword()">
        Відкрити ❄️
      </button>

      <div id="message" aria-live="polite"></div>

    </div>

    <h1>SNIZHKA</h1>
    <h2>BETWEEN US</h2>

    <div class="headphones">
      This page sounds better with headphones.
    </div>

    <audio controls preload="metadata">
      <source src="7777777.mp3" type="audio/mpeg">
    </audio>

    <div class="footer">
      ONE VOICE • ONE RECORDING • ONE MOMENT
    </div>

  </main>

  <script>
    function showPassword() {
      const box = document.getElementById("passwordBox");

      box.style.display = "block";
      document.getElementById("password").focus();
    }

    function checkPassword() {
      const input = document.getElementById("password");
      const message = document.getElementById("message");

      const answer = input.value.trim().toLowerCase();

      if (answer === "квіти") {
        message.textContent = "Правильно! Відкриваємо історію... ❄️";

        setTimeout(function() {
          window.location.href = "quest.html";
        }, 1000);

      } else {
        message.textContent = "Не зовсім... Спробуй ще раз ❄️";
      }
    }

    document.getElementById("password")
      .addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
          checkPassword();
        }
      });
  </script>

</body>
</html>
